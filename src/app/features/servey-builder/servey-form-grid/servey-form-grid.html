<div class="grid col-12 main-content">
  <div class="col-12 pb-10 text-end">
    <p-button label="New Form" severity="primary" (onClick)="onNewForm()"></p-button>
  </div>
  <div class="card form-container">
    <p-table [value]="forms" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
      [rowsPerPageOptions]="[5, 10, 20]">
      <ng-template #header>
        <tr>
          <th style="width:25%">Form Name</th>
          <th style="width:25%">ID</th>
          <th style="width:20%">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-forms>
        <tr>
          <td>{{ forms.formName }}</td>
          <td>{{ forms.id }}</td>
          <td>
            <p-button icon="pi pi-eye" severity="info" [rounded]="true" [text]="true" pTooltip="View Details"
              (onClick)="viewForm(forms)">
            </p-button>

            <p-button icon="pi pi-pencil" severity="danger" [rounded]="true" [text]="true" pTooltip="Edit Form"
              (onClick)="editForm(forms)">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
